# ==============================================================================
# Logrotate configuration for Self Excellence
# Prevents logs from filling the 6-8 GB VPS SSD
# Place at: /etc/logrotate.d/self-excellence
# ==============================================================================

/var/www/self-excellence/backend/logs/*.log {
    daily
    missingok
    rotate 7
    compress
    delaycompress
    notifempty
    copytruncate
    create 0640 root root
}

/var/log/nginx/*.log {
    daily
    missingok
    rotate 7
    compress
    delaycompress
    notifempty
    sharedscripts
    postrotate
        [ -f /var/run/nginx.pid ] && kill -USR1 $(cat /var/run/nginx.pid)
    endscript
}
